site_name: Guide to Scholarly Indexes

site_url: https://agCleo.github.io/GuideScholIndex/

theme:
  name: material
  custom_dir: overrides
  language: en # Default language for interface
  logo: assets/EDCH_IconColourPos.png
  favicon: assets/EDCH_IconColourPos.png
  palette:
    primary: indigo
    accent: deep orange
  features:
    - navigation.tabs # Horizontal menu at the top
    - search.suggest
    - search.highlight
    - navigation.top # Back to the top button

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - pymdownx.magiclink # Automatically transforms URLs in hyperlinks

plugins:
  - search
  - i18n:
      docs_structure: suffix
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: fr
          name: Français
          build: true

extra:
  social:
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/company/eudch/
    - icon: fontawesome/solid/paper-plane
      link: mailto:<arnaud.gingold@openedition.org>

copyright: This content is available under licence CC-BY 4.0

nav: # Contains file names without the language extension processed by i18n plugin
  - Home: index.md
  - Index:
    - BASE: GuideScholIndex_BASE.md
    - CEEOL: GuideScholIndex_CEEOL.md
    - CORE: GuideScholIndex_CORE.md
    - Crossref: GuideScholIndex_Crossref.md
    - Datacite: GuideScholIndex_Datacite.md
    - DDH: GuideScholIndex_DDH.md
    - Dimensions: GuideScholIndex_Dimensions.md
    - DOAJ: GuideScholIndex_DOAJ.md
    - EBSCOHost: GuideScholIndex_EBSCOHost.md
    - ERIH Plus: GuideScholIndex_ERIH_PLUS.md
    - EZB: GuideScholIndex_EZB.md
    - Google Scholar: GuideScholIndex_Google_Scholar.md
    - GoTriple: GuideScholIndex_GoTriple.md
    - Latindex: GuideScholIndex_ Latindex.md
    - OPENAIRE Graph: GuideScholIndex_OPENAIRE_Graph.md
    - OpenAlex: GuideScholIndex_OpenAlex.md
    - Pubmed: GuideScholIndex_Pubmed.md
    - ROAD: GuideScholIndex_ROAD.md
    - Redalyc: GuideScholIndex_Redalyc.md
    - Scopus: GuideScholIndex_Scopus.md
    - Semantic Scholar: GuideScholIndex_Semantic_Scholar.md
    - WebOfScience: GuideScholIndex_WebOfscience.md
  - Reference:
    - Template: GuideScholIndex_template_v4.md
    
    
